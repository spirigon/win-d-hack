[project]
name = "wind-d"
version = "0.1.0"
description = "Wind Power Forecasting — ARVE 2026 Hackathon submission."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "wind-d team" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "mlruns", "data", "models", "submissions", ".dvc"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length handled by formatter
  "B008", # function-call default-argument is fine for Hydra/typer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802"]
"src/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "notebooks", "data", "models", "submissions", "mlruns", ".dvc"]
extraPaths = ["."]
reportMissingImports = "warning"
pythonVersion = "3.11"
typeCheckingMode = "basic"

# --------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:pytorch_lightning.*",
]
markers = [
  "slow: tests that take > 30 s (deselect with -m 'not slow')",
  "gpu: tests that require CUDA",
]
