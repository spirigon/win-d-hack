name: wind-d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=24.3.*

  # core scientific
  - numpy=1.26.4
  - pandas=2.2.3
  - polars=1.18.0
  - pyarrow=18.1.0
  - scipy=1.14.1
  - scikit-learn=1.5.2

  # gradient boosting + tuning
  - lightgbm=4.5.0
  - optuna=4.1.0

  # validation + io
  - pandera=0.22.1

  # deep learning (CUDA 12.4)
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-lightning=2.4.0
  - torchmetrics=1.6.0

  # tracking + config + data versioning
  - mlflow=2.18.0
  - hydra-core=1.3.2
  - dvc=3.58.0

  # plotting + notebooks
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - jupyterlab=4.3.4

  # dev tooling
  - pytest=8.3.4
  - ruff=0.8.4
  - pip-tools=7.4.1

  # Russian holidays + utilities
  - workalendar=17.0.0
  - tqdm=4.67.1
  - pyyaml=6.0.2

  - pip:
    # PyTorch Forecasting + foundation models — installed via pip to keep wheels current
    - pytorch-forecasting==1.2.0
    - timesfm==2.0.0
    - chronos-forecasting==1.5.0
    - uni2ts==1.2.0
    - peft==0.13.2
    - transformers==4.46.3
    - accelerate==1.1.1
